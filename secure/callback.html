<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Política de Segurança de Conteúdo para página de callback OIDC -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://caracore-backend.azurewebsites.net https://accounts.google.com https://*.google.com https://login.microsoftonline.com https://*.microsoft.com; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validando login - Cara Core</title>
  <link rel="icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/secure/css/secure-layout.css?v=20251012" />
  <link rel="stylesheet" href="/secure/css/secure-callback.css?v=20251012" />
  <link rel="stylesheet" href="/secure/css/enhanced-alerts.css?v=20251012" />
</head>
<body>
  <svg aria-hidden="true" focusable="false" class="icon-sprite">
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 4 5v6c0 5.2 3.4 10 8 11 4.6-1 8-5.8 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9.5 11V9a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="9" y="11" width="6" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="13.5" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8.5 12.5 11 15l4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="site-shell" role="main">
    <div class="card" aria-live="polite">
      <div class="card-inner">
        <span class="card-badge">
          <svg class="icon" aria-hidden="true"><use href="#icon-shield"></use></svg>
          Validando credenciais
        </span>
        <div class="spinner" role="status" aria-label="Processando autenticação"></div>
        <div>
          <h1>Em instantes você estará na Área 51</h1>
          <p>Estamos confirmando sua identidade com o provedor selecionado. Esse processo leva apenas alguns segundos.</p>
        </div>
        <div class="footer-link" id="fallbackLink" hidden>
          <a href="/secure/index.html">Voltar para o início da Área 51</a>
        </div>
      </div>
    </div>
  </div>

  <script defer src="/secure/log-config.js?v=20251001"></script>
  <script defer src="/secure/logger.js?v=20250930"></script>
  <script defer src="/secure/dynamic-config.js?v=20250930"></script>
  <script defer src="/secure/oauth-callback-auto-fix.js?v=20251011"></script>
  <script defer src="/secure/js/error-handler.js?v=20251012"></script>
  <script defer src="/secure/js/enhanced-error-handler.js?v=20251012"></script>
  <script defer src="/secure/auth-standalone.js?v=20251001b"></script>
  <script defer src="/secure/js/nav-controls.js?v=20251012"></script>
  <script defer src="/secure/js/callback-helpers.js?v=20251012"></script>
  
  <!-- Sistema de Autorização - Fase 4 -->
  <script src="/secure/js/authorization-check.js?v=20251102"></script>
  <script>
    // Verificação de autorização após autenticação OAuth bem-sucedida
    document.addEventListener('DOMContentLoaded', function() {
      // Aguardar processamento do OAuth primeiro
      setTimeout(async function() {
        try {
          // Obter informações do usuário do OAuth
          const userEmail = localStorage.getItem('user_email') || 
                           localStorage.getItem('auth_user_email') ||
                           new URLSearchParams(window.location.search).get('email');
          
          const provider = localStorage.getItem('auth_provider') || 
                          new URLSearchParams(window.location.search).get('provider') || 
                          'google';
          
          if (userEmail) {
            console.log('Callback: Verificando autorização para', userEmail);
            
            // Verificar autorização (com loading indicator)
            const isAuthorized = await requireAuthorization({
              email: userEmail,
              provider: provider,
              showLoading: true
            });
            
            // Se chegou aqui, está autorizado - continuar para restrita.html
            if (isAuthorized) {
              console.log('Callback: Usuário autorizado, redirecionando para área restrita');
              
              // Pequeno delay para mostrar sucesso
              setTimeout(() => {
                window.location.href = '/secure/restrita.html';
              }, 1500);
            }
            // Se não autorizado, requireAuthorization já redirecionou para access-denied
            
          } else {
            console.warn('Callback: Email do usuário não encontrado');
            // Fallback para OAuth completar primeiro
            setTimeout(() => {
              window.location.href = '/secure/restrita.html';
            }, 3000);
          }
          
        } catch (error) {
          console.error('Callback: Erro na verificação de autorização:', error);
          // Em caso de erro, redirecionar para acesso negado
          window.location.href = '/secure/access-denied.html?error=' + encodeURIComponent(error.message);
        }
      }, 2000); // Aguardar 2 segundos para OAuth completar
    });
    
    // Listener para sucesso de autorização
    document.addEventListener('authorizationSuccess', function(event) {
      console.log('Callback: Autorização confirmada:', event.detail);
      
      // Atualizar UI para mostrar sucesso
      const badge = document.querySelector('.card-badge');
      if (badge) {
        badge.innerHTML = `
          <svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg>
          Acesso autorizado
        `;
        badge.style.background = '#dcfce7';
        badge.style.color = '#166534';
      }
      
      const title = document.querySelector('h1');
      if (title) {
        title.textContent = 'Acesso confirmado!';
      }
      
      const description = document.querySelector('p');
      if (description) {
        description.textContent = 'Sua autorização foi verificada. Redirecionando para a Área 51...';
      }
      
      // Esconder spinner
      const spinner = document.querySelector('.spinner');
      if (spinner) {
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
