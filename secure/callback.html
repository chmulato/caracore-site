<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validando login - Cara Core</title>
  <link rel="icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/secure/css/secure-layout.css?v=20251012" />
  <link rel="stylesheet" href="/secure/css/secure-callback.css?v=20251012" />
  <link rel="stylesheet" href="/secure/css/enhanced-alerts.css?v=20251012" />
</head>
<body>
  <svg aria-hidden="true" focusable="false" class="icon-sprite">
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 4 5v6c0 5.2 3.4 10 8 11 4.6-1 8-5.8 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9.5 11V9a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="9" y="11" width="6" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="13.5" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8.5 12.5 11 15l4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="site-shell" role="main">
    <div class="card" aria-live="polite">
      <div class="card-inner">
        <span class="card-badge">
          <svg class="icon" aria-hidden="true"><use href="#icon-shield"></use></svg>
          Validando credenciais
        </span>
        <div class="spinner" role="status" aria-label="Processando autenticação"></div>
        <div>
          <h1>Em instantes você estará na Área 51</h1>
          <p>Estamos confirmando sua identidade com o provedor selecionado. Esse processo leva apenas alguns segundos.</p>
        </div>
        <div class="footer-link" id="fallbackLink" hidden>
          <a href="/secure/index.html">Voltar para o início da Área 51</a>
        </div>
      </div>
    </div>
  </div>

  <script defer src="/secure/log-config.js?v=20251001"></script>
  <script defer src="/secure/logger.js?v=20250930"></script>
  <script defer src="/secure/dynamic-config.js?v=20250930"></script>
  <script defer src="/secure/oauth-callback-auto-fix.js?v=20251011"></script>
  <script defer src="/secure/js/error-handler.js?v=20251012"></script>
  <script defer src="/secure/js/enhanced-error-handler.js?v=20251012"></script>
  <script defer src="/secure/auth-standalone.js?v=20251001b"></script>
  <script defer src="/secure/js/nav-controls.js?v=20251012"></script>
  <script defer src="/secure/js/callback-helpers.js?v=20251012"></script>
</body>
</html>
