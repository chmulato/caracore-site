name: Sync Blog to LinkedIn

on:
  push:
    branches:
      - main
    paths:
      - personal/feed.xml
      - personal/articles/**
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate LinkedIn secrets
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
            echo "Missing secret: LINKEDIN_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$LINKEDIN_AUTHOR_URN" ]; then
            echo "Missing secret: LINKEDIN_AUTHOR_URN"
            exit 1
          fi

      - name: Publish latest RSS item to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          BLOG_RSS_PATH: personal/feed.xml
          LINKEDIN_MAX_RECENT_CHECK: "15"
          LINKEDIN_POST_PREFIX: "Novo artigo publicado no blog"
          LINKEDIN_POST_HASHTAGS: "#CaraCore #ArquiteturaDeSoftware #EngenhariaDeSoftware"
        run: python scripts/linkedin_sync_from_rss.py
