<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Política de Segurança de Conteúdo (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
    
    <!-- X-Content-Type-Options: Previne MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Referrer Policy: Controla informações de referência -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Cara Core</title>
    <script>
        // Script para redirecionar SPA rotas para index.html
        // Detecta se a URL solicitada está relacionada ao caminho seguro
        const path = window.location.pathname;
        if (path.startsWith('/secure/')) {
            window.location.replace('/secure/index.html');
        } else {
            window.location.replace('/');
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0078d4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Página não encontrada</h1>
        <p>A página que você está procurando não existe ou foi movida.</p>
        <p>Redirecionando para a página principal...</p>
        <a href="/" class="btn">Ir para a página inicial</a>
    </div>
</body>
</html>
