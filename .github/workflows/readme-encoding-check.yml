name: README Encoding Check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  readme-encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate README encoding (Python)
        run: python3 tools/validate_encoding.py readme --root .
