<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Área Restrita - Simulação Estática</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --accent: #7dd3fc;
      --warning: #fbbf24;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: rgba(255,255,255,0.12);
      --button: #2563eb;
      --button-dark: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #111827 40%, #1e293b 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .shell {
      width: min(840px, calc(100% - 32px));
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      padding: 32px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(125, 211, 252, 0.12);
      border: 1px solid rgba(125, 211, 252, 0.3);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1;
    }
    p {
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.7;
      margin: 0 0 18px;
    }
    .banner {
      margin: 22px 0;
      padding: 18px 20px;
      border-radius: 14px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      font-weight: 700;
    }
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 18px 0 30px;
    }
    .item {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    .item h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .item p {
      margin: 0;
      font-size: .94rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }
    a.button.primary {
      background: var(--button);
      color: white;
    }
    a.button.primary:hover { background: var(--button-dark); }
    a.button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Área Restrita — Acesso Negado</h1>
    <p>
      Esta é uma área protegida. O acesso está restrito a usuários autenticados.
    </p>

    <div class="actions">
      <a class="button primary" href="/">Voltar ao site principal</a>
    </div>
  </main>
</body>
</html>
