name: Site validation

on:
  push:
    branches: [master, main]
    paths:
      - '**.html'
      - '**.htm'
      - '**.css'
      - 'delivery/**'
      - 'publications/**'
      - '_redirects'
      - 'vercel.json'
      - 'scripts/**'
      - 'tools/**'
      - 'sala/**'
      - 'personal/**'
      - 'aligned/**'
  pull_request:
    paths:
      - '**.html'
      - '**.htm'
      - '**.css'
      - 'delivery/**'
      - 'publications/**'
      - '_redirects'
      - 'vercel.json'
      - 'scripts/**'
      - 'tools/**'
      - 'sala/**'
      - 'personal/**'
      - 'aligned/**'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run site validation (Etapa 1 + 2)
        shell: pwsh
        run: ./scripts/run-site-validation.ps1

      - name: Validate README encoding
        shell: pwsh
        run: python tools/validate_encoding.py readme --root .
