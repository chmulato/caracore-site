name: Deploy Docker Backend to Azure Container Registry

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile.azure'
      - '.github/workflows/azure-docker-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Docker Container
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: caracoreregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.azure
        push: true
        tags: |
          caracoreregistry.azurecr.io/caracore-backend:latest
          caracoreregistry.azurecr.io/caracore-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Deploy to Azure Web App for Containers
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'caracore-backend-docker'
        publish-profile: ${{ secrets.AZURE_WEBAPP_DOCKER_PUBLISH_PROFILE }}
        images: 'caracoreregistry.azurecr.io/caracore-backend:latest'
    
    - name: Wait for deployment to complete
      run: sleep 45
    
    - name: Health check
      run: |
        echo "🔄 Checking application health..."
        for i in {1..5}; do
          response=$(curl -s -o /dev/null -w "%{http_code}" https://caracore-backend-docker.azurewebsites.net/health)
          if [ $response -eq 200 ]; then
            echo "✅ Backend is healthy (HTTP $response)"
            break
          else
            echo "⏳ Attempt $i: Backend health check returned HTTP $response, retrying in 15s..."
            sleep 15
          fi
          if [ $i -eq 5 ]; then
            echo "❌ Backend health check failed after 5 attempts"
            exit 1
          fi
        done
    
    - name: Test authorization API
      run: |
        echo "🔐 Testing authorization API..."
        response=$(curl -s -o /dev/null -w "%{http_code}" https://caracore-backend-docker.azurewebsites.net/api/admin/users)
        if [ $response -eq 200 ]; then
          echo "✅ Authorization API is responding (HTTP $response)"
        else
          echo "⚠️  Authorization API returned unexpected status (HTTP $response)"
        fi
    
    - name: Verify authorized users data
      run: |
        echo "👥 Checking authorized users data..."
        users_data=$(curl -s https://caracore-backend-docker.azurewebsites.net/api/admin/users)
        user_count=$(echo $users_data | jq '.users | length')
        echo "📊 Total users loaded: $user_count"
        
        # Check if suporte@caracore.com.br exists and is super_admin
        suporte_role=$(echo $users_data | jq -r '.users[] | select(.email=="suporte@caracore.com.br") | .role')
        if [ "$suporte_role" = "super_admin" ]; then
          echo "✅ suporte@caracore.com.br is correctly set as super_admin"
        else
          echo "⚠️  suporte@caracore.com.br role: $suporte_role (expected: super_admin)"
        fi