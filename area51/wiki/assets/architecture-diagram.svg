<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
  <!-- Definições de gradientes e filtros -->
  <defs>
    <!-- Gradientes -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#084298;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#198754;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5132;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63384;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6610f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d0a91;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtro de sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Título -->
  <text x="500" y="30" text-anchor="middle" fill="#212529" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Arquitetura do Sistema OAuth 2.1 + OIDC - CaraCore
  </text>
  
  <!-- Usuário -->
  <g transform="translate(50, 80)">
    <circle cx="40" cy="40" r="30" fill="url(#blueGradient)" filter="url(#shadow)"/>
    <text x="40" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32">👤</text>
    <text x="40" y="100" text-anchor="middle" fill="#212529" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Usuário</text>
  </g>
  
  <!-- CDN Frontend (Estático) -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Frontend (CDN)</text>
    <text x="90" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">HTML + CSS + JavaScript</text>
    <text x="90" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Bootstrap 5.3</text>
    <text x="90" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">OIDC Client</text>
    <text x="90" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">✅ Hospedagem Global</text>
  </g>
  
  <!-- Provedores OIDC -->
  <g transform="translate(450, 60)">
    <!-- Google -->
    <rect x="0" y="0" width="100" height="50" rx="8" fill="url(#orangeGradient)" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Google</text>
    <text x="50" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">OIDC Provider</text>
    
    <!-- Microsoft -->
    <rect x="0" y="70" width="100" height="50" rx="8" fill="url(#orangeGradient)" filter="url(#shadow)"/>
    <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Microsoft</text>
    <text x="50" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Entra ID</text>
  </g>
  
  <!-- Backend API -->
  <g transform="translate(650, 60)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Backend API</text>
    <text x="100" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Python Flask 3.0.3</text>
    <text x="100" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Docker Container</text>
    <text x="100" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">JWT Validation</text>
    <text x="100" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">🔒 Azure Web App</text>
  </g>
  
  <!-- Admin Panel -->
  <g transform="translate(650, 220)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#dc3545" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Painel Admin</text>
    <text x="100" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Gestão de Usuários</text>
    <text x="100" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Aprovações</text>
    <text x="100" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">⚡ Fase 5 - Super Admin</text>
  </g>
  
  <!-- Azure Infrastructure -->
  <g transform="translate(200, 380)">
    <rect x="0" y="0" width="650" height="150" rx="15" fill="#0078d4" fill-opacity="0.1" stroke="#0078d4" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="20" y="25" fill="#0078d4" font-family="Arial, sans-serif" font-size="18" font-weight="bold">☁️ Microsoft Azure Cloud</text>
    
    <!-- Azure Web App -->
    <rect x="30" y="40" width="140" height="80" rx="8" fill="#0078d4" filter="url(#shadow)"/>
    <text x="100" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Azure Web App</text>
    <text x="100" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Container Service</text>
    <text x="100" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Auto-scaling</text>
    <text x="100" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Load Balancer</text>
    
    <!-- Azure Container Registry -->
    <rect x="200" y="40" width="140" height="80" rx="8" fill="#0078d4" filter="url(#shadow)"/>
    <text x="270" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Container Registry</text>
    <text x="270" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Docker Images</text>
    <text x="270" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">CI/CD Pipeline</text>
    <text x="270" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Private Registry</text>
    
    <!-- Monitoring -->
    <rect x="370" y="40" width="140" height="80" rx="8" fill="#0078d4" filter="url(#shadow)"/>
    <text x="440" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Application Insights</text>
    <text x="440" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Monitoring</text>
    <text x="440" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Logs & Metrics</text>
    <text x="440" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Alertas</text>
    
    <!-- Security Center -->
    <rect x="540" y="40" width="140" height="80" rx="8" fill="#0078d4" filter="url(#shadow)"/>
    <text x="610" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Security Center</text>
    <text x="610" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">HTTPS/TLS</text>
    <text x="610" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Firewall</text>
    <text x="610" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Rate Limiting</text>
  </g>
  
  <!-- Setas de conexão -->
  <!-- Usuário para Frontend -->
  <path d="M 130 120 L 180 120" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="155" y="115" text-anchor="middle" fill="#28a745" font-family="Arial, sans-serif" font-size="10">HTTPS</text>
  
  <!-- Frontend para Provedores OIDC -->
  <path d="M 380 110 L 430 95" stroke="#fd7e14" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 380 130 L 430 115" stroke="#fd7e14" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="405" y="90" text-anchor="middle" fill="#fd7e14" font-family="Arial, sans-serif" font-size="10">OAuth 2.1</text>
  <text x="405" y="150" text-anchor="middle" fill="#fd7e14" font-family="Arial, sans-serif" font-size="10">+ PKCE</text>
  
  <!-- Frontend para Backend -->
  <path d="M 380 120 L 630 120" stroke="#6610f2" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="505" y="115" text-anchor="middle" fill="#6610f2" font-family="Arial, sans-serif" font-size="10">JWT Token</text>
  
  <!-- Backend para Admin Panel -->
  <path d="M 750 180 L 750 200" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="780" y="195" fill="#dc3545" font-family="Arial, sans-serif" font-size="10">Super Admin</text>
  
  <!-- Backend para Azure -->
  <path d="M 750 180 L 750 360" stroke="#0078d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  
  <!-- Definição das setas -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#28a745"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fd7e14"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6610f2"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc3545"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/>
    </marker>
  </defs>
  
  <!-- Legenda de segurança -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" fill="#212529" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔒 Segurança</text>
    <text x="10" y="40" fill="#212529" font-family="Arial, sans-serif" font-size="10">• PKCE</text>
    <text x="10" y="55" fill="#212529" font-family="Arial, sans-serif" font-size="10">• JWT Validation</text>
    <text x="10" y="70" fill="#212529" font-family="Arial, sans-serif" font-size="10">• HTTPS Only</text>
    <text x="10" y="85" fill="#212529" font-family="Arial, sans-serif" font-size="10">• CSP Headers</text>
  </g>
  
  <!-- Métricas -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#e7f3ff" stroke="#0078d4" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" fill="#0078d4" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📊 Status</text>
    <text x="10" y="40" fill="#212529" font-family="Arial, sans-serif" font-size="10">Fase 5: ✅ 100%</text>
    <text x="10" y="55" fill="#212529" font-family="Arial, sans-serif" font-size="10">Testes: 77.3%</text>
    <text x="10" y="70" fill="#212529" font-family="Arial, sans-serif" font-size="10">Uptime: 99.9%</text>
    <text x="10" y="85" fill="#212529" font-family="Arial, sans-serif" font-size="10">Deploy: Auto</text>
    <text x="10" y="100" fill="#dc3545" font-family="Arial, sans-serif" font-size="10">Next: Fase 6</text>
  </g>
</svg>