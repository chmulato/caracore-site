name: Sync Blog to LinkedIn

on:
  push:
    branches:
      - main
    paths:
      - personal/feed.xml
      - personal/articles/**
      - sala/redes/retro/feed.xml
      - sala/redes/retro/articles/**
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check LinkedIn secrets
        id: secrets
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ] || [ -z "$LINKEDIN_AUTHOR_URN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::LinkedIn secrets are required for manual execution (workflow_dispatch)."
              exit 1
            fi
            echo "::warning::LinkedIn secrets are not configured. Skipping publication for this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish latest RSS item to LinkedIn
        if: steps.secrets.outputs.ready == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          BLOG_RSS_PATHS: personal/feed.xml,sala/redes/retro/feed.xml
          LINKEDIN_MAX_RECENT_CHECK: "15"
          LINKEDIN_POST_PREFIX: "Nova publicacao sincronizada da Cara Core"
          LINKEDIN_POST_HASHTAGS: "#CaraCore #ArquiteturaDeSoftware #EngenhariaDeSoftware"
        run: python scripts/linkedin_sync_from_rss.py

      - name: Skip summary
        if: steps.secrets.outputs.ready != 'true'
        run: echo "LinkedIn sync skipped because required secrets are missing."
